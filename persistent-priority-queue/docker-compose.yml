services:
  postgres:
    image: postgres:16-alpine
    container_name: ppq-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: priority_queue
    volumes:
      - ppq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d priority_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ppq_postgres_data:

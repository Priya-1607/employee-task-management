services:
  - type: web
    name: employee-task-management-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    root: .
    dockerBuildContext: backend
    dockerfilePath: backend/Dockerfile
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-frontend-url
